eUserId!==owner)return\n   this.assertOwner(token);this.applyAvatar(path)\n  }catch(e){if(!this.disposed&&this.profileUserId===owner&&getApp().globalData.sessionToken===token&&!/cancel/i.test(e.errMsg||e.message||''))this.setData({error:/privacy|authorize/i.test(e.errMsg||e.message||'')?'请同意微信的隐私授权后再选择照片。':e.message||'相册打开失败，请检查微信的相册权限后重试'})}finally{if(!this.disposed&&this.profileUserId===owner&&getApp().globalData.sessionToken===token)this.setData({choosingAvatar:false})}\n },", "avatarError": "avatarError(){this.setData({avatarBroken:true})},", "useWechatNickname": "useWechatNickname(){if(this.data.busy||this.data.choosingAvatar||!this.data.profileStep)return;this.setData({nicknameFocus:true})},", "nicknameInput": "nicknameInput(e){if(this.data.busy)return;this.profileSaveId=null;this.setData({nickname:e.detail.value,error:''})},", "nicknameBlur": "nicknameBlur(e){this.setData({nicknameFocus:false});this.reviewNickname=String(e.detail.value||'').trim();this.nicknameInput(e);if(!this.canReview)this.reviewedNickname=this.reviewNickname},", "nicknameReview": "nicknameReview(e){if(e.detail.pass){this.reviewedNickname=this.reviewNickname;this.rejectedNickname=null}else{this.rejectedNickname=this.reviewNickname;this.setData({error:'昵称未通过检查，请修改后重试'})}},", "assertOwner": "assertOwner(token){if(!token||getApp().globalData.sessionToken!==token||getApp().globalData.userInfo?.id!==this.profileUserId)throw new Error('账号已切换，请重新打开个人资料')},", "saveProfile": "async saveProfile(e){\n  if(this.data.busy||this.data.choosingAvatar)return\n  const nickname=String(e?.detail?.value?.nickname??this.data.nickname).trim(),token=getApp().globalData.sessionToken\n  this.setData({busy:true,error:'',nickname})\n  try{\n   this.assertOwner(token)\n   if(nickname.length>30)throw new Error('昵称最多 30 个字')\n   if(nickname&&nickname!==this.originalNickname&&this.canReview){\n    this.setData({reviewing:true});const until=Date.now()+3000\n    while(this.reviewedNickname!==nickname&&this.rejectedNickname!==nickname&&Date.now()<until&&!this.disposed)await new Promise(r=>setTimeout(r,50))\n    if(this.disposed)return\n    this.assertOwner(token)\n    if(this.rejectedNickname===nickname)throw new Error('昵称未通过检查，请修改后重试')\n    if(this.reviewedNickname!==nickname)throw new Error('昵称检查尚未完成，请收起键盘后重试')\n   }\n   const avatarUploadId=this.photo?await uploadAvatar(this.photo):undefined;this.assertOwner(token)\n   this.profileSaveId=this.profileSaveId||requestId()\n   const user=await call('profile.update',{...(nickname?{name:nickname}:{}),...(avatarUploadId?{avatarUploadId}:{}),profileSetupDone:true},this.profileSaveId)\n   this.assertOwner(token);getApp().setUserInfo(user)\n   if(!this.disposed)await this.finish()\n  }catch(e){if(!this.disposed)this.setData({error:e.message||'资料保存失败，请重试'})}finally{if(!this.disposed)this.setData({busy:false,reviewing:false})}\n },", "skipProfile": "async skipProfile(){if(this.data.busy||this.data.choosingAvatar)return;const token=getApp().globalData.sessionToken;try{this.assertOwner(token);wx.setStorageSync('hui.profile.dismissed.'+this.profileUserId,true);this.setData({busy:true,error:''});await this.finish()}catch(e){if(!this.disposed)this.setData({error:e.message||'请重试'})}finally{if(!this.disposed)this.setData({busy:false})}},", "finish": "async finish(){if(this.disposed)return;if(this.data.saveId){auth.claimGradeSave(this.data.saveId);await grades.refreshStudents();if(!this.disposed)wx.reLaunch({url:'/packages/grades/pages/record/index?save='+encodeURIComponent(this.data.saveId)})}else wx.navigateBack({fail:()=>wx.reLaunch({url:'/pages/home/index'})})},", "cancel": "cancel(){if(!this.data.busy&&!this.data.choosingAvatar)wx.navigateBack({fail:()=>wx.reLaunch({url:'/pages/home/index'})})},\n})"}, "path": "miniprogram/pages/login/index", "hash": "12ffa9c144f1"}}, "assets": {"/assets/redesign/contour-bg.jpg": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAADC6A
