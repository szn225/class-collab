<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>慧共创 · 平台管理</title><link rel="stylesheet" href="/manage.css?v=1.1.0"></head>
<body>
<section id="login" class="login-screen"><div class="login-card"><div class="login-brand"><svg class="icon" aria-hidden="true"><use href="/admin/icons.svg#paper"/></svg><span>慧共创</span></div><h1>管理员登录</h1><form id="loginForm"><label>账号<input name="name" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="field-error" role="alert"></p><button type="submit" class="primary full">登录后台</button></form></div></section>
<div id="workspace" class="workspace" hidden>
 <aside id="sidebar"><a class="brand" href="/manage.html"><svg class="icon" aria-hidden="true"><use href="/admin/icons.svg#paper"/></svg><span>慧共创</span><small>平台管理</small></a><nav id="nav" aria-label="主要导航"></nav><div class="sidebar-foot">平台管理员 <span>v1.1.0</span></div></aside>
 <div class="work-area"><header><div class="header-title"><button type="button" id="menuToggle" class="icon-button mobile-only" aria-label="展开导航"><svg class="icon"><use href="/admin/icons.svg#root-list"/></svg></button><span id="currentTitle">运行概览</span></div><div class="header-actions"><button type="button" id="refresh" class="icon-button" aria-label="刷新当前页面"><svg class="icon"><use href="/admin/icons.svg#refresh"/></svg></button><button type="button" id="logout" class="quiet">退出登录</button></div></header>
 <main id="main"><div id="pendingBanner" class="notice" hidden><span>有一笔提交结果待确认的操作</span><button type="button" data-action="resume">继续核对</button></div><div id="message" role="status" aria-live="polite"></div><div id="content" tabindex="-1"></div></main></div>
</div>
<dialog id="drawer" class="drawer"><div class="dialog-head"><h2 id="drawerTitle"></h2><button type="button" class="icon-button" data-action="closeDrawer" aria-label="关闭详情"><svg class="icon"><use href="/admin/icons.svg#close"/></svg></button></div><div id="drawerBody"></div></dialog>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" class="icon-button" data-action="closeDialog" aria-label="关闭对话框"><svg class="icon"><use href="/admin/icons.svg#close"/></svg></button></div><div id="dialogBody"></div><p id="dialogError" class="field-error" role="alert"></p></dialog>
<script type="module" src="/manage.js?v=1.1.0"></script></body></html>
